<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Score ⚽ Guess the score of today's match</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="Daily Score ⚽ Guess the score of today's match">
<meta property="og:description" content="One big football match a day: guess the score, climb the rankings, play leagues with your friends. Free, no betting.">
<meta property="og:image" content="https://dailyscoreapp.com/og-en.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/favicon.png">
<style>html,body{margin:0;height:100%;background:#0b1a12;color:#f2f7f3;font:17px system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center}a{color:#c6ff3d}</style>
</head>
<body>
<p>⚽ <a id="go" href="/">Daily Score</a></p>
<script>
// short link (bio, posts): the click is counted with its source and language, then the visitor lands on the match of the day in his language
(function () {
  var LANGS = ['en', 'fr', 'es', 'pt', 'de', 'it', 'ar', 'tr', 'ru'];
  var q = new URLSearchParams(location.search);
  var src = (q.get('s') || document.documentElement.getAttribute('data-src') || 'go').replace(/[^a-z0-9_]/gi, '').slice(0, 30);
  var l = (navigator.language || 'en').slice(0, 2).toLowerCase(); if (LANGS.indexOf(l) < 0) l = 'en';
  var hit = 'https://pote-ia-bot-en-production.up.railway.app/ds/hit?s=' + encodeURIComponent(src) + '&l=' + l;
  try { if (navigator.sendBeacon) navigator.sendBeacon(hit); else fetch(hit, { mode: 'no-cors', keepalive: true }); } catch (e) {}
  var dest = '/?src=' + encodeURIComponent(src);
  document.getElementById('go').href = dest;
  setTimeout(function () { location.replace(dest); }, 150);
})();
</script>
</body>
</html>
