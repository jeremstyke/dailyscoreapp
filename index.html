// Google sign-in (official button): the ID token is checked by the server, which opens the session.
let GOOGLE_ID = null;
async function googleButton() {
  try {
    if (GOOGLE_ID === null) { const r = await fetch(API + '/ds/api/google_conf', { method: 'POST' }); GOOGLE_ID = (await r.json()).id || ''; }
    if (!GOOGLE_ID) return;
    if (!window.google || !google.accounts) {
      await new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc); });
    }
    google.accounts.id.initialize({ client_id: GOOGLE_ID, callback: async (resp) => {
      try {
        const r = await fetch(API + '/ds/api/google_login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: resp.credential, lang, android: IS_ANDROID ? 1 : 0, src: (() => { try { return localStorage.getItem('ds_src') || ''; } catch (e) { return ''; } })() }) });
        const j = await r.json();
        if (!j.token) throw new Error('google');
        localStorage.setItem('ds_token', j.token); TOKEN = j.token; load();
      } catch (e) { toast(t('wErr')); }
    } });
    const el = document.getElementById('gbtn');
    if (el) google.accounts.id.renderButton(el, { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', width: Math.min(320, el.offsetWidth || 300), locale: lang });
  } catch (e) {}
}

// the prediction made before signing up is saved right after the account is ready
async function applyPendingPick() {
  let p = null; try { p = JSON.parse(localStorage.getItem('ds_pend_pick') || 'null'); } catch (e) {}
  if (!p) return;
  try { localStorage.removeItem('ds_pend_pick'); } catch (e) {}
  if (p.next) {
    // tomorrow's match, chosen before today's match ended: saved for tomorrow
    try { st = await api('pick', { home: p.home, away: p.away, next: 1 }); render(); toast(t('pvSavedNext')); } catch (e) { return; }
  } else {
    if (!st || !st.match || st.pick || st.match.day !== p.day || new Date(st.match.kickoff).getTime() <= Date.now()) return;
    try { st = await api('pick', { home: p.home, away: p.away }); home = p.home; away = p.away; editing = false; render(); toast(t('saved')); try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} } catch (e) { return; }
  }
  api('ev', { k: 'pick_before_signup' }).catch(() => {});
  const k = pendingKey; pendingKey = null;
  if (k) setTimeout(() => showKey(k, () => confirmCountry()), 900); else setTimeout(confirmCountry, 1200);
}

function pickPhoto(cb) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => { const s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = 256; c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256); URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg', 0.82)); };
    img.onerror = () => { URL.revokeObjectURL(url); toast(t('err')); };
    img.src = url;
  };
  inp.click();
}

  const tll = document.getElementById('tllater'); if (tll) tll.onclick = () => { try { localStorage.setItem('ds_tglink_off', String(Date.now())); } catch (e) {} const c = document.getElementById('tlcard'); if (c) c.remove(); };
  const wg = document.getElementById('wgift'); if (wg) wg.onclick = async () => {
    wg.disabled = true; haptic('medium');
    try { trendData = await api('trend_welcome'); st.trendPaid = true; render(); }

  };
  document.querySelectorAll('[data-mday]').forEach((x) => x.onclick = () => openMatchDetail(x.dataset.mday));
  // website and Android app: opening Instant Gaming (affiliate link) unlocks today's trend
  const igu = document.getElementById('igunlock'); if (igu) igu.onclick = async () => {

    window.open(IG_URL, '_blank', 'noopener');

  };
  document.querySelectorAll('[data-tip]').forEach((x) => x.onclick = () => sendTip(x.dataset.tip));
  const cof = document.getElementById('coffee'); if (cof) cof.onclick = () => { api('ev', { k: 'coffee_click' }).catch(() => {}); };
  const gk = document.getElementById('gkey'); if (gk) gk.onclick = () => newKey(false);
  const nfok = document.getElementById('nfok'); if (nfok) nfok.onclick = () => { haptic(); st.notifs = []; api('notifs_seen').catch(() => {}); render(); };
  const ig = document.getElementById('instgo'); if (ig) ig.onclick = doInstall;
  const il = document.getElementById('instlater'); if (il) il.onclick = () => { haptic(); try { localStorage.setItem('ds_inst_later', String(Date.now())); } catch (e) {} render(); };
  document.querySelectorAll('[data-pid]').forEach((x) => x.onclick = () => { haptic(); openProfile(x.dataset.pid); });
  const myp = document.getElementById('myprof'); if (myp) myp.onclick = () => { haptic(); openProfile(st.me.pid); };
  document.querySelectorAll('[data-pm]').forEach((x) => x.onclick = () => buyPremium(x.dataset.pm));

async function loadTrend() { try { trendData = await api('trend'); render(); return true; } catch (e) { return false; } }
async function buyTrend() {
  haptic('medium');
  if ((st.trendPaid || st.me.premium) && await loadTrend()) return;
  if (IS_ANDROID && !(st.me.freeTrends > 0)) { toast(t('andTrend')); view = 'leagues'; render(); return; }
  if (!IN_TG && !(st.me.freeTrends > 0)) { if (isWebOnly()) return startLink(); toast(t('buyOnTg')); openLink('https://t.me/' + BOT + '?start=src_web_trend'); return; }
  if (st.me.freeTrends > 0) {
    // a gift is used: never fall back to the Stars payment; if the answer got lost, check whether the trend is unlocked
    try { trendData = await api('trend_free'); st.me.freeTrends--; st.trendPaid = true; render(); return; }
    catch (e) {
      try { st = await api('state'); if (st.trendPaid && await loadTrend()) { render(); return; } } catch (er) {}
      toast(t('err')); render(); return;
    }
  }
  try {
    const r = await api('trend_invoice');
    if (!r.link) return toast(t('err'));
    tg.openInvoice(r.link, async (status) => {
      if (status !== 'paid') return;
      for (let i = 0; i < 6; i++) { if (await loadTrend()) return; await new Promise((ok) => setTimeout(ok, 1200)); }
      toast(t('err'));
    });
  } catch (e) { toast(t('err')); }
}
// a bot button can open a precise place: ?go=profile&pid=… (friend request, tease) or ?go=league&lg=…
let goDone = false;
function goTo() {
  if (goDone || !st || !st.me || !st.me.country) return;
  goDone = true;
  const q = new URLSearchParams(location.search);
  const go = q.get('go');
  if (!go) return;
  try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
  if (go === 'profile' && q.get('pid')) { view = 'leagues'; openProfile(q.get('pid')); }
  else if (go === 'league' && Number(q.get('lg'))) { view = 'leagues'; openLeague(Number(q.get('lg'))); }
}
async function load() {
  if (!IN_TG && !TOKEN) return previewView();
  await finishWebLink();
  try {
    st = await api('state'); rk = null; if (st.trendPaid) loadTrend(); render(); if (period !== 'week' || tab !== 'world') loadRanking();
    let pref = null; try { pref = localStorage.getItem('ds_ref'); localStorage.removeItem('ds_ref'); } catch (e) {}
    if (pref && !IN_TG) api('ref_set', { ref: pref }).catch(() => {});
    let pend = null; try { pend = JSON.parse(localStorage.getItem('ds_lg') || 'null'); localStorage.removeItem('ds_lg'); } catch (e) {}
    if (pend && pend.c && st.me.country) doJoin(pend.c, pend.r);
    goTo();
    if (!IN_TG && st.me.country) applyPendingPick();
  }
  catch (e) { if (e && e.code === 'maintenance') return maintView(); document.getElementById('app').innerHTML = `<div class="card center"><p>${esc(t('err'))}</p><button class="btn go" onclick="load()">↻</button></div>`; }
}
setInterval(() => { if (st && ((st.match && isLive(st.match)) || (st.prev && isLive(st.prev.match))) && view === 'match' && !leagueView) load(); }, 60000);
setInterval(() => { const el = document.getElementById('cd'); if (el && st && st.match) { const ms = new Date(st.match.kickoff).getTime() - Date.now(); if (ms <= 0) load(); else el.textContent = countdown(ms); } }, 30000);
load();
checkAppUpdate();
// Android app: count this phone once (first opening), for the install counter
if (IS_ANDROID) { try { if (!localStorage.getItem('ds_inst')) { const d = Array.from(crypto.getRandomValues(new Uint8Array(12)), (x) => x.toString(16).padStart(2, '0')).join(''); fetch('https://pote-ia-bot-en-production.up.railway.app/ds/install', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ d }) }).then(() => localStorage.setItem('ds_inst', d)).catch(() => {}); } } catch (e) {} }
if (!IN_TG && 'serviceWorker' in navigator && (location.hostname === 'dailyscoreapp.com' || location.hostname.endsWith('github.io'))) navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
if (!IN_TG) document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && TOKEN && isWebOnly()) load(); });
