<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
// scrolling down inside the game must not close or minimize the mini app (Telegram 7.7+)
try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
try { tg.setHeaderColor('#0b1a12'); tg.setBackgroundColor('#0b1a12'); } catch (e) {}
const BOT = 'DailyScorefootbot';
const IN_TG = !!(tg && tg.initData);
if (!IN_TG) document.documentElement.classList.add('shell');
// the game can run on dailyscoreapp.com (web, Android app, and Telegram) or on the server itself
const API = location.hostname.endsWith('railway.app') ? '' : 'https://pote-ia-bot-en-production.up.railway.app';
let IS_ANDROID = false;
try {
  if (new URLSearchParams(location.search).get('src') === 'android' || document.referrer.startsWith('android-app://')) sessionStorage.setItem('ds_android', '1');
  IS_ANDROID = !IN_TG && sessionStorage.getItem('ds_android') === '1';
  const qv = new URLSearchParams(location.search).get('v'); if (qv) sessionStorage.setItem('ds_appv', qv);
} catch (e) {}
let TOKEN = null;
try {
  const hp = new URLSearchParams(location.hash.slice(1));
  if (hp.get('t')) { localStorage.setItem('ds_token', hp.get('t')); history.replaceState(null, '', location.pathname); }
  if (hp.get('err')) { window.__loginErr = true; history.replaceState(null, '', location.pathname); }
  if (hp.get('lnk')) { localStorage.setItem('ds_lnk', hp.get('lnk')); history.replaceState(null, '', location.pathname); }
  if (hp.get('ref')) { localStorage.setItem('ds_ref', hp.get('ref')); history.replaceState(null, '', location.pathname); }
  if (hp.get('lg')) { localStorage.setItem('ds_lg', JSON.stringify({ c: hp.get('lg'), r: hp.get('r') || null })); history.replaceState(null, '', location.pathname); }
  TOKEN = localStorage.getItem('ds_token');
} catch (e) {}
const DS_INTER = 'int-51534'; // Adsgram interstitial block
// Interstitial (Adsgram): once a day, after the first validation of the score (not on changes),
// not on the player's first day, never for Premium. Telegram only.
// TADS fullscreen (widget 12430): the interstitial in Telegram
const TADS_FS = 12430;
// a way out of the fullscreen ad: our close button after 5 seconds, and Telegram's Back button
function fsEscape(box) {
  let btn = null, done = false;
  const close = () => {
    if (done) return; done = true;
    try { box.innerHTML = ''; } catch (e) {}
    document.querySelectorAll('body > div, body > iframe').forEach((el) => {
      if (el.id === 'nav' || el.id === 'app' || el === box) return;
      const cs = getComputedStyle(el);
      if ((cs.position === 'fixed' || cs.position === 'absolute') && Number(cs.zIndex) > 50 && el.offsetWidth >= innerWidth * 0.9 && el.offsetHeight >= innerHeight * 0.6) el.remove();
    });
    if (btn) btn.remove();
    try { tg.BackButton.offClick(close); tg.BackButton.hide(); } catch (e) {}
    api('ev', { k: 'ad_tads_fs_close' }).catch(() => {});
  };
  try { tg.BackButton.onClick(close); tg.BackButton.show(); } catch (e) {}
  setTimeout(() => {
    if (done) return;
    btn = document.createElement('button');
    btn.textContent = t('adClose');
    btn.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));z-index:2147483647;padding:12px 22px;border-radius:999px;border:0;background:rgba(0,0,0,.78);color:#fff;font:700 15px Inter,system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.4)';
    btn.onclick = close;
    document.documentElement.appendChild(btn);
  }, 5000);
  // when the ad closes by itself, clean up
  const watch = setInterval(() => { if (done) return clearInterval(watch); if (!box.innerHTML.trim()) { clearInterval(watch); done = true; if (btn) btn.remove(); try { tg.BackButton.offClick(close); tg.BackButton.hide(); } catch (e) {} } }, 1000);
}
function showTadsFullscreen() {
  return new Promise((resolve, reject) => {
    loadTads(() => {
      try {
        let box = document.getElementById('tads-container-' + TADS_FS);
        if (!box) { box = document.createElement('div'); box.id = 'tads-container-' + TADS_FS; document.body.appendChild(box); }
        let none = false;
        const c = window.tads.init({ widgetId: TADS_FS, type: 'FULLSCREEN', debug: TADS_DEBUG(), onAdsNotFound: () => { none = true; api('ev', { k: 'ad_tads_fs_none' }).catch(() => {}); reject(new Error('none')); } });
        c.loadAd().then(() => { if (none) return; c.showAd(); api('ev', { k: 'ad_tads_fs' }).catch(() => {}); fsEscape(box); resolve(); }).catch(reject);
      } catch (e) { reject(e); }
    }, () => reject(new Error('script')));
  });
}
// Ads switched off for now (only the rewarded ad is on): set to true to bring them back
const INTER_ON = false, TASK_ON = false;
function showInter() {
  if (!INTER_ON) return;
  try {
    if (!IN_TG || (st && st.me && st.me.premium)) return;
    const today = new Date().toISOString().slice(0, 10);
    let c = {}; try { c = JSON.parse(localStorage.getItem('ds_inter3') || '{}'); } catch (e) {}
    const n = c.d === today ? c.n || 0 : 0;
    const owner = !!(st && st.me && st.me.id === 7057960224); // the owner sees real ads without the daily limit
    // no fullscreen on a player's first day (fewer than 2 picks, one pick per day), then 2 a day at most
    if (!owner && !TADS_DEBUG() && ((st.me.picks || 0) < 2 || n >= 1)) return;
    localStorage.setItem('ds_inter3', JSON.stringify({ d: today, n: n + 1, at: Date.now() }));
    if (window.Adsgram) window.Adsgram.init({ blockId: DS_INTER }).show().then(() => api('ev', { k: 'ad_inter' }).catch(() => {})).catch(() => api('ev', { k: 'ad_inter_none' }).catch(() => {}));

async function openLeague(id) {

function premiumCard() {

    return `<button class="plan ${best ? 'best' : ''}" data-pm="${k}"><small>${k === 'l' ? '♾️ ' : ''}${esc(name)}</small><b>${esc(m ? m[1] : rest)}</b>${disc ? `<span class="tag">${esc(disc)}</span>` : ''}</button>`;
  };

}

  };

  ['avedit3', 'avedit4'].forEach((id) => { const x = document.getElementById(id); if (x) x.onclick = openAvatarPicker; });

  const ig = document.getElementById('instgo'); if (ig) ig.onclick = doInstall;

  const lgj = document.getElementById('lgj'); if (lgj) lgj.onclick = () => { haptic(); joinView(); };

async function loadTrend() { try { trendData = await api('trend'); render(); return true; } catch (e) { return false; } }
async function buyTrend() {
  haptic('medium');
  if ((st.trendPaid || st.me.premium) && await loadTrend()) return;
  if (IS_ANDROID && !(st.me.freeTrends > 0)) { toast(t('andTrend')); view = 'leagues'; render(); return; }
  if (!IN_TG && !(st.me.freeTrends > 0)) { if (isWebOnly()) return startLink(); toast(t('buyOnTg')); openLink('https://t.me/' + BOT + '?start=src_web_trend'); return; }
  if (st.me.freeTrends > 0) {
    // a gift is used: never fall back to the Stars payment; if the answer got lost, check whether the trend is unlocked
    try { trendData = await api('trend_free'); st.me.freeTrends--; st.trendPaid = true; render(); return; }
    catch (e) {
      try { st = await api('state'); if (st.trendPaid && await loadTrend()) { render(); return; } } catch (er) {}
      toast(t('err')); render(); return;
    }
  }
  try {
    const r = await api('trend_invoice');
    if (!r.link) return toast(t('err'));
    tg.openInvoice(r.link, async (status) => {
      if (status !== 'paid') return;
      for (let i = 0; i < 6; i++) { if (await loadTrend()) return; await new Promise((ok) => setTimeout(ok, 1200)); }
      toast(t('err'));
    });
  } catch (e) { toast(t('err')); }
}
// a bot button can open a precise place: ?go=profile&pid=… (friend request, tease) or ?go=league&lg=…
let goDone = false;
function goTo() {
  if (goDone || !st || !st.me || !st.me.country) return;
  goDone = true;
  const q = new URLSearchParams(location.search);
  const go = q.get('go');
  if (!go) return;
  try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
  if (go === 'profile' && q.get('pid')) { view = 'leagues'; openProfile(q.get('pid')); }
  else if (go === 'league' && Number(q.get('lg'))) { view = 'leagues'; openLeague(Number(q.get('lg'))); }
}
async function load() {
  if (!IN_TG && !TOKEN) return loginView();
  await finishWebLink();
  try {
    st = await api('state'); rk = null; if (st.trendPaid) loadTrend(); render(); if (period !== 'week' || tab !== 'world') loadRanking();
    let pref = null; try { pref = localStorage.getItem('ds_ref'); localStorage.removeItem('ds_ref'); } catch (e) {}
    if (pref && !IN_TG) api('ref_set', { ref: pref }).catch(() => {});
    let pend = null; try { pend = JSON.parse(localStorage.getItem('ds_lg') || 'null'); localStorage.removeItem('ds_lg'); } catch (e) {}
    if (pend && pend.c && st.me.country) doJoin(pend.c, pend.r);
    goTo();
  }
  catch (e) { document.getElementById('app').innerHTML = `<div class="card center"><p>${esc(t('err'))}</p><button class="btn go" onclick="load()">↻</button></div>`; }
}
setInterval(() => { if (st && ((st.match && isLive(st.match)) || (st.prev && isLive(st.prev.match))) && view === 'match' && !leagueView) load(); }, 60000);
setInterval(() => { const el = document.getElementById('cd'); if (el && st && st.match) { const ms = new Date(st.match.kickoff).getTime() - Date.now(); if (ms <= 0) load(); else el.textContent = countdown(ms); } }, 30000);
load();
checkAppUpdate();
// Android app: count this phone once (first opening), for the install counter
if (IS_ANDROID) { try { if (!localStorage.getItem('ds_inst')) { const d = Array.from(crypto.getRandomValues(new Uint8Array(12)), (x) => x.toString(16).padStart(2, '0')).join(''); fetch('https://pote-ia-bot-en-production.up.railway.app/ds/install', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ d }) }).then(() => localStorage.setItem('ds_inst', d)).catch(() => {}); } } catch (e) {} }
if (!IN_TG && 'serviceWorker' in navigator && (location.hostname === 'dailyscoreapp.com' || location.hostname.endsWith('github.io'))) navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
if (!IN_TG) document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && TOKEN && isWebOnly()) load(); });
