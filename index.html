    <button class="btn gold" data-pm="m">${esc(t('pmM'))}</button>
    <button class="btn gold" data-pm="y" style="margin-top:8px">${esc(t('pmY'))}</button>
    <button class="btn ghost" data-pm="l" style="margin-top:8px">♾️ ${esc(t('pmL'))}</button></div>`;
}
async function buyPremium(plan) {
  haptic('medium');
  try {
    const r = await api('premium_invoice', { plan });
    if (!r.link) return toast(t('err'));
    tg.openInvoice(r.link, async (status) => {
      if (status !== 'paid') return;
      for (let i = 0; i < 8; i++) { await new Promise((ok) => setTimeout(ok, 1200)); try { st = await api('state'); if (st.me.premium) { render(); toast(t('pmOk')); try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} return; } } catch (e) {} }
    });
  } catch (e) { toast(t('err')); }
}
function profileCard() {
  return `<div class="card"><div class="label">📈 ${esc(t('myStats'))}</div><div class="stats">
    <div class="stat"><b>${st.me.points}</b><span>${esc(t('pts'))}</span></div>
    <div class="stat"><b>${st.me.exact || 0}</b><span>🎯</span></div>
    <div class="stat"><b>${st.me.picks || 0}</b><span>⚽</span></div></div>
    ${st.me.pid ? `<button class="btn go" id="myprof">👤 ${esc(t('pfMine'))}</button>` : ''}
    <button class="btn ghost" id="set2" style="margin-top:8px">⚙️ ${esc(t('settings2'))}</button>
    ${ON_ANDROID_WEB ? `<a class="btn ghost" href="${APK_PAGE}" style="display:block;text-decoration:none;text-align:center;margin-top:8px">📲 ${esc(t('apkBtn'))}</a>` : ''}
    ${IN_TG ? `<button class="btn ghost" style="margin-top:8px" data-ext="https://dailyscoreapp.com/?src=tg_app">🌐 ${esc(t('webBtn'))}</button>` : ''}</div>`;
}
function render() {
  if (!st.me.country) return setupView();
  lang = S[st.me.lang] ? st.me.lang : 'en'; applyLang();
  if (st.pick && !editing) { home = st.pick.home; away = st.pick.away; }
  document.getElementById('app').innerHTML = `
  <div class="top"><div class="brand"><img class="blogo" src="https://dailyscoreapp.com/logo-96.png" alt="">Daily <b>Score</b><span class="beta">BETA</span></div>
    <div class="chips"><div class="chip fire" id="hfire" style="cursor:pointer">🔥 ${st.me.streak || 0}</div><div class="chip" id="htrophy" style="cursor:pointer">🏆 ${st.me.points}</div></div></div>
  ${view === 'match' ? notifCard() + installCard(false) + matchCard() + trendCard() + voteCard() + lastCard() : view === 'rank' ? rankingCard() : view === 'leagues' ? leaguesCard() + inviteCard() : profileCard() + premiumCard() + installCard(true) + streakCard() + badgesCard()}`;
  navBar();
  bind();
}
function bind() {
  document.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => {
    haptic(); const s = b.dataset.s;
    if (s === 'h+') home = Math.min(20, home + 1); if (s === 'h-') home = Math.max(0, home - 1);
    if (s === 'a+') away = Math.min(20, away + 1); if (s === 'a-') away = Math.max(0, away - 1);
    document.getElementById('gh').textContent = home; document.getElementById('ga').textContent = away;
  });
  const lock = document.getElementById('lock');
  if (lock) lock.onclick = async () => {
    lock.disabled = true; haptic('medium');
    try { st = await api('pick', { home, away }); editing = false; setTimeout(showInter, 900); try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} toast(t('saved')); render(); }
    catch (e) { toast(e.code === 'started' ? t('errStarted') : t('err')); lock.disabled = false; if (e.code === 'started') load(); }
  };
  const edit = document.getElementById('edit'); if (edit) edit.onclick = () => { editing = true; render(); };
  const share = document.getElementById('share'); if (share) share.onclick = () => { api('ev', { k: 'share' }).catch(() => {}); shareLink(IN_TG ? 'https://t.me/' + BOT + '?start=src_share' : WEB + '#ref=' + st.me.id, t('shareText')); };
  const tr = document.getElementById('trend'); if (tr) tr.onclick = buyTrend;
  document.querySelectorAll('[data-vote]').forEach((x) => x.onclick = () => castVote(x.dataset.vote));
  const nfok = document.getElementById('nfok'); if (nfok) nfok.onclick = () => { haptic(); st.notifs = []; api('notifs_seen').catch(() => {}); render(); };
  const ig = document.getElementById('instgo'); if (ig) ig.onclick = doInstall;
  const il = document.getElementById('instlater'); if (il) il.onclick = () => { haptic(); try { localStorage.setItem('ds_inst_later', String(Date.now())); } catch (e) {} render(); };
  document.querySelectorAll('[data-pid]').forEach((x) => x.onclick = () => { haptic(); openProfile(x.dataset.pid); });
  const myp = document.getElementById('myprof'); if (myp) myp.onclick = () => { haptic(); openProfile(st.me.pid); };
  document.querySelectorAll('[data-pm]').forEach((x) => x.onclick = () => buyPremium(x.dataset.pm));
  const gopm = document.getElementById('gopm'); if (gopm) gopm.onclick = () => { haptic(); view = 'profile'; render(); scrollTop0(); };
  const trtg = document.getElementById('trendtg'); if (trtg) trtg.onclick = () => { haptic(); window.open('https://t.me/' + BOT + '?start=src_' + (IS_ANDROID ? 'android' : 'web') + '_trend', '_blank'); };
  document.querySelectorAll('[data-lg]').forEach((x) => x.onclick = () => { haptic(); openLeague(Number(x.dataset.lg)); });
  const lgc = document.getElementById('lgc'); if (lgc) lgc.onclick = () => { haptic(); createView(); };
  const lgj = document.getElementById('lgj'); if (lgj) lgj.onclick = () => { haptic(); joinView(); };
  document.querySelectorAll('[data-b]').forEach((x) => x.onclick = () => { haptic(); const b = DSB.find((y) => y[0] === x.dataset.b); toast((x.classList.contains('on') ? '✅ ' : '🔒 ') + b[1] + ' ' + bLabel(b)); });
  const inv = document.getElementById('invite'); if (inv) inv.onclick = () => { haptic('medium'); api('ev', { k: 'invite' }).catch(() => {}); shareLink(IN_TG ? 'https://t.me/' + BOT + '?start=ref_' + st.me.id : WEB + '#ref=' + st.me.id, t('invShare')); };
  document.querySelectorAll('[data-tab]').forEach((x) => x.onclick = () => { haptic(); tab = x.dataset.tab; loadRanking(); });
  document.querySelectorAll('[data-period]').forEach((x) => x.onclick = () => { haptic(); period = x.dataset.period; loadRanking(); });
  const set = document.getElementById('set'); if (set) set.onclick = () => { setupView(); };
  document.querySelectorAll('[data-ext]').forEach((x) => x.onclick = () => { haptic(); try { tg.openLink(x.dataset.ext); } catch (e) { window.open(x.dataset.ext, '_blank'); } });
  const hf = document.getElementById('hfire'); if (hf) hf.onclick = () => { haptic(); view = 'profile'; leagueView = null; render(); const sc = document.getElementById('streakcard'); if (sc) sc.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
  const ht = document.getElementById('htrophy'); if (ht) ht.onclick = () => { haptic(); view = 'rank'; leagueView = null; render(); scrollTop0(); };
  const set2 = document.getElementById('set2'); if (set2) set2.onclick = () => { setupView(); };
}
async function loadTrend() { try { trendData = await api('trend'); render(); return true; } catch (e) { return false; } }
async function buyTrend() {
  haptic('medium');
  if ((st.trendPaid || st.me.premium) && await loadTrend()) return;
  if (IS_ANDROID && !(st.me.freeTrends > 0)) { toast(t('andTrend')); view = 'leagues'; render(); return; }
  if (!IN_TG && !(st.me.freeTrends > 0)) { if (isWebOnly()) return startLink(); toast(t('buyOnTg')); openLink('https://t.me/' + BOT + '?start=src_web_trend'); return; }
  if (st.me.freeTrends > 0) { try { trendData = await api('trend_free'); st.me.freeTrends--; st.trendPaid = true; render(); return; } catch (e) {} }
  try {
    const r = await api('trend_invoice');
    if (!r.link) return toast(t('err'));
    tg.openInvoice(r.link, async (status) => {
      if (status !== 'paid') return;
      for (let i = 0; i < 6; i++) { if (await loadTrend()) return; await new Promise((ok) => setTimeout(ok, 1200)); }
      toast(t('err'));
    });
  } catch (e) { toast(t('err')); }
}
async function load() {
  if (!IN_TG && !TOKEN) return loginView();
  await finishWebLink();
  try {
    st = await api('state'); rk = null; if (st.trendPaid) loadTrend(); render(); if (period !== 'week' || tab !== 'world') loadRanking();
    let pref = null; try { pref = localStorage.getItem('ds_ref'); localStorage.removeItem('ds_ref'); } catch (e) {}
    if (pref && !IN_TG) api('ref_set', { ref: pref }).catch(() => {});
    let pend = null; try { pend = JSON.parse(localStorage.getItem('ds_lg') || 'null'); localStorage.removeItem('ds_lg'); } catch (e) {}
    if (pend && pend.c && st.me.country) doJoin(pend.c, pend.r);
  }
  catch (e) { document.getElementById('app').innerHTML = `<div class="card center"><p>${esc(t('err'))}</p><button class="btn go" onclick="load()">↻</button></div>`; }
}
setInterval(() => { if (st && st.match && ['IN_PLAY', 'PAUSED', 'LIVE'].includes(st.match.live_status) && st.match.status !== 'FINISHED' && view === 'match' && !leagueView) load(); }, 60000);
setInterval(() => { const el = document.getElementById('cd'); if (el && st && st.match) { const ms = new Date(st.match.kickoff).getTime() - Date.now(); if (ms <= 0) load(); else el.textContent = countdown(ms); } }, 30000);
load();
checkAppUpdate();
// Android app: count this phone once (first opening), for the install counter
if (IS_ANDROID) { try { if (!localStorage.getItem('ds_inst')) { const d = Array.from(crypto.getRandomValues(new Uint8Array(12)), (x) => x.toString(16).padStart(2, '0')).join(''); fetch('https://pote-ia-bot-en-production.up.railway.app/ds/install', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ d }) }).then(() => localStorage.setItem('ds_inst', d)).catch(() => {}); } } catch (e) {} }
if (!IN_TG && 'serviceWorker' in navigator && (location.hostname === 'dailyscoreapp.com' || location.hostname.endsWith('github.io'))) navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
if (!IN_TG) document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && TOKEN && isWebOnly()) load(); });
</script>
